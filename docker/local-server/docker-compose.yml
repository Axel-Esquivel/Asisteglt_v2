# Servidor local de AsisteGLT (red Wi-Fi sin internet): MongoDB, API y web con HTTPS.
# Uso: ver docs/13-puesta-en-marcha.md §3.2
name: asisteglt-local

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    image: asisteglt-api:local
    build:
      context: ../..
      dockerfile: docker/local-server/Dockerfile.api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATA_STORE: mongo
      MONGODB_URI: mongodb://mongo:27017/asisteglt?replicaSet=rs0
      STORAGE_DIR: /data/storage
      SECURE_COOKIES: 'true'
      # nginx (contenedor web) es el único proxy delante de la API: un salto de confianza.
      TRUST_PROXY: '1'
    volumes:
      - storage:/data/storage
    # Preparación: MongoDB responde y el directorio de archivos admite escritura.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: asisteglt-web:local
    build:
      context: ../..
      dockerfile: docker/local-server/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  mongo-data:
  storage:
