# Servidor local: HTTPS con el certificado de la CA local (generate-certs.sh) y proxy a la API.
# Log de acceso en JSON con el mismo identificador que recibe la API (X-Request-Id).
log_format json_access escape=json '{"time":"$time_iso8601","requestId":"$request_id",'
  '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"durationS":$request_time,"upstreamS":"$upstream_response_time"}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Lotes de carga: hasta 20 archivos de 200 MB cada uno (la API los recibe en disco por bloques).
  client_max_body_size 1024m;

  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;
  access_log /var/log/nginx/access.log json_access;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión: el paquete inicial pasa de ~0,7 MB a ~0,2 MB (carga en 4G, RNF-06).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_vary on;


  # API y tiempo real (Socket.IO en /api/v1/realtime).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 300s;
    # Las subidas pasan directo a la API sin copiarse antes a un temporal de nginx.
    proxy_request_buffering off;
  }

  # El service worker y su manifiesto nunca se guardan en caché del navegador.
  location ~ ^/(ngsw-worker\.js|ngsw\.json|index\.html)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Solo archivos con hash de compilación en el nombre (main-AB12CD34.js, chunk-…, styles-…, fuentes):
  # inmutables, caché de un año. ngsw-worker.js, íconos y manifiesto no llevan hash y no entran aquí.
  location ~ ^/(?:(?:chunk|main|polyfills|styles)-[A-Za-z0-9_-]{8}\.(?:js|css)|media/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
