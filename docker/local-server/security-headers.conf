# Cabeceras de seguridad (ASVS V14.4). Se incluyen en el server y en cada location que use
# `add_header`, porque nginx no hereda las cabeceras cuando un location define las suyas.
#
# CSP: sin scripts en línea; `style-src` necesita 'unsafe-inline' porque PrimeNG aplica estilos
# dinámicos (tema y posición de overlays); `img-src` admite data: (código QR) y blob: (fotos de
# evidencia y descargas). Validada con las pruebas e2e contra la compilación de producción.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
