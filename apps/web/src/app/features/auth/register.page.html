<p-card>
  <ng-template #title><h1 class="auth-form__title">Crear cuenta</h1></ng-template>
  <ng-template #subtitle>Regístrate para crear o unirte a proyectos</ng-template>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error(); as message) {
      <p-message severity="error" data-testid="register-error">{{ message }}</p-message>
    }
    <p-floatlabel variant="on">
      <input pInputText id="displayName" formControlName="displayName" autocomplete="name" class="full-width" />
      <label for="displayName">Nombre</label>
    </p-floatlabel>
    <p-floatlabel variant="on">
      <input pInputText id="email" type="email" formControlName="email" autocomplete="email" class="full-width" />
      <label for="email">Correo electrónico</label>
    </p-floatlabel>
    <p-floatlabel variant="on">
      <p-password
        inputId="password"
        formControlName="password"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="full-width"
        inputStyleClass="full-width"
      />
      <label for="password">Contraseña</label>
    </p-floatlabel>
    <p class="auth-form__hint">Mínimo 12 caracteres, con letras y números.</p>
    <p-button type="submit" label="Crear cuenta" icon="pi pi-user-plus" [loading]="submitting()" styleClass="full-width" />
  </form>
  <ng-template #footer>
    <p class="auth-form__alternative">¿Ya tienes cuenta? <a routerLink="/auth/login">Iniciar sesión</a></p>
  </ng-template>
</p-card>
