<p-card>
  <ng-template #title><h1 class="auth-form__title">Iniciar sesión</h1></ng-template>
  <ng-template #subtitle>Accede a tus proyectos de reportes e inventarios</ng-template>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error(); as message) {
    <p-message severity="error" data-testid="login-error">{{ message }}</p-message>
    }
    <p-floatlabel variant="on">
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        class="full-width"
      />
      <label for="email">Correo electrónico</label>
    </p-floatlabel>
    <p-floatlabel variant="on">
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="full-width"
        inputStyleClass="full-width"
      />
      <label for="password">Contraseña</label>
    </p-floatlabel>
    <p-button
      type="submit"
      label="Entrar"
      icon="pi pi-sign-in"
      [loading]="submitting()"
      styleClass="full-width"
    />
  </form>
  <ng-template #footer>
    <p class="auth-form__alternative">
      ¿No tienes cuenta? <a routerLink="/auth/register">Crear una cuenta</a>
    </p>
  </ng-template>
</p-card>
