<div class="sharing">
  <p-card header="Nuevo vínculo">
    <form class="sharing__form" [formGroup]="form" (ngSubmit)="create()">
      <p-floatlabel variant="on">
        <p-select
          inputId="linkRole"
          [options]="roleOptions()"
          optionLabel="label"
          optionValue="value"
          formControlName="role"
          styleClass="full-width"
          appendTo="body"
        />
        <label for="linkRole">Rol al unirse</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="linkDays"
          formControlName="expiresInDays"
          [min]="1"
          [max]="365"
          [showButtons]="true"
          styleClass="full-width"
        />
        <label for="linkDays">Días de vigencia (vacío = sin caducidad)</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="linkUses"
          formControlName="maxUses"
          [min]="1"
          [max]="10000"
          [showButtons]="true"
          styleClass="full-width"
        />
        <label for="linkUses">Usos máximos (vacío = ilimitados)</label>
      </p-floatlabel>
      <p-button type="submit" label="Generar vínculo" icon="pi pi-link" [loading]="saving()" />
    </form>

    @if (createdUrl(); as url) {
    <div class="sharing__created" data-testid="share-url">
      <p-message severity="success">Comparte este vínculo; solo se muestra una vez.</p-message>
      <div class="sharing__url">
        <input pInputText [value]="url" [readonly]="true" class="full-width" aria-label="Vínculo generado" />
        <p-button icon="pi pi-copy" ariaLabel="Copiar vínculo" (onClick)="copy(url)" />
      </div>
    </div>
    }
  </p-card>

  <p-card header="Vínculos emitidos">
    <p-table [value]="links()" dataKey="id" [tableStyle]="{ 'min-width': '32rem' }">
      <ng-template #header>
        <tr>
          <th>Rol</th>
          <th>Caduca</th>
          <th>Usos</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-link>
        <tr>
          <td>{{ link.roleLabel() }}</td>
          <td>{{ link.expiresAt === null ? 'Nunca' : (link.expiresAt | date: 'short') }}</td>
          <td>{{ link.usesLabel() }}</td>
          <td>
            <p-tag
              [value]="link.active ? 'Activo' : 'Inactivo'"
              [severity]="link.active ? 'success' : 'secondary'"
            />
          </td>
          <td>
            @if (link.active) {
            <p-button
              icon="pi pi-ban"
              [text]="true"
              severity="danger"
              ariaLabel="Revocar vínculo"
              (onClick)="revoke(link)"
            />
            }
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">Aún no hay vínculos.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
