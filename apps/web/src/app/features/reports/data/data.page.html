<p-card>
  <ng-template #title>
    <div class="reports__title">
      <span>Datos cargados</span>
      <div class="reports__toolbar">
        <p-select [options]="periodOptions()" optionLabel="label" optionValue="value" [ngModel]="period()" (ngModelChange)="period.set($event); filtersChanged()" [showClear]="true" placeholder="Todos los períodos" ariaLabel="Período" />
        <p-select [options]="profileOptions()" optionLabel="label" optionValue="value" [ngModel]="profileId()" (ngModelChange)="profileId.set($event); filtersChanged()" [showClear]="true" placeholder="Todas las preconfiguraciones" ariaLabel="Preconfiguración" />
        <p-select [options]="companyOptions()" optionLabel="label" optionValue="value" [ngModel]="companyId()" (ngModelChange)="companyId.set($event); filtersChanged()" [showClear]="true" placeholder="Todas las compañías" ariaLabel="Compañía" />
      </div>
    </div>
  </ng-template>
  <p-table
    [value]="page().rows"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="page().total"
    [loading]="loading()"
    (onLazyLoad)="onLazyLoad($event)"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': '48rem' }"
    data-testid="data-table"
  >
    <ng-template #header>
      <tr>
        <th>Período</th>
        <th>Compañía</th>
        @for (field of columns(); track field.key) {
          <th>{{ field.label }}</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>{{ row.period }}</td>
        <td>{{ companyName(row.companyId) }} · {{ row.currency }}</td>
        @for (field of columns(); track field.key) {
          <td [class.reports__number]="field.isNumeric()">{{ cell(row, field) }}</td>
        }
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td [attr.colspan]="columns().length + 2">No hay datos publicados con estos filtros.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
